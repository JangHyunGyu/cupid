name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Media checks recover encrypted fixtures from their plaintext Git ancestors.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore verified image originals
        run: npm exec --yes --package=wrangler@4.123.0 -- python scripts/image-storage.py restore --from-git
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f5ced3498c8b7674581b5c9987f31585
      - run: npm test

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Media checks recover encrypted fixtures from their plaintext Git ancestors.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore verified image originals
        run: npm exec --yes --package=wrangler@4.123.0 -- python scripts/image-storage.py restore --from-git
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f5ced3498c8b7674581b5c9987f31585
      - run: npm run test:e2e
