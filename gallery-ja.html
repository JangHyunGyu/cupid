<body>
    <!-- Header -->
    <header class="gallery-header">
        <h1>📖 ギャラリー</h1>
        <div class="header-actions">
            <a href="/index-ja" class="back-btn" onclick="if(window.opener&&!window.opener.closed){window.close();return false;}">← タイトルへ</a>
            <div class="lang-combo" id="langCombo">
                <div class="lang-combo-selected" onclick="toggleLangCombo()">
                    <span class="lang-flag">🇯🇵</span> 日本語
                </div>
                <div class="lang-combo-dropdown">
                    <a href="gallery.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','ko')">
                        <span class="lang-flag">🇰🇷</span> 한국어
                    </a>
                    <a href="gallery-en.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','en')">
                        <span class="lang-flag">🇺🇸</span> English
                    </a>
                    <a href="gallery-es.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','es')">
                        <span class="lang-flag">🇪🇸</span> Español
                    </a>
                    <div class="lang-combo-option active">
                        <span class="lang-flag">🇯🇵</span> 日本語
                    </div>
                    <a href="gallery-fr.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','fr')">
                        <span class="lang-flag">🇫🇷</span> Français
                    </a>
                    <a href="gallery-de.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','de')">
                        <span class="lang-flag">🇩🇪</span> Deutsch
                    </a>
                    <a href="gallery-pt.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','pt')">
                        <span class="lang-flag">🇧🇷</span> Português
                    </a>
                    <a href="gallery-zh.html" class="lang-combo-option" onclick="window.CupidStorage.setItem('cupid:language','zh')">
                        <span class="lang-flag">🇨🇳</span> 简体中文
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="gallery-container">
        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="characters">👤 キャラクター</button>
            <button class="tab-btn" data-tab="cg">🖼️ イベントCG</button>
            <button class="tab-btn" data-tab="endings">🏆 エンディング</button>
            <button class="tab-btn" data-tab="music">🎵 ミュージックルーム</button>
            <button class="tab-btn" data-tab="tips">💡 ヒント</button>
        </nav>

        <!-- Tab Contents -->
        <section id="tab-characters" class="tab-content active">
            <div id="character-grid" class="character-grid">
                <!-- Characters will be rendered here -->
            </div>
        </section>

        <section id="tab-cg" class="tab-content">
            <div id="cg-grid" class="cg-grid">
                <!-- CG items will be rendered here -->
            </div>
        </section>

        <section id="tab-endings" class="tab-content">
            <div id="ending-summary" class="ending-summary" role="status"></div>
            <div id="ending-grid" class="ending-grid"></div>
        </section>

        <section id="tab-music" class="tab-content">
            <div id="music-list" class="music-list">
                <!-- Music items will be rendered here -->
            </div>
        </section>

        <!-- Free talk tips tab (public) -->
        <section id="tab-tips" class="tab-content">
            <div id="tips-root" class="tips-root"></div>
        </section>
    </main>

    <!-- Character Detail Modal -->
    <div id="character-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-char-name">キャラクター名</h2>
                    <p id="modal-char-title" style="color: #aaa; font-size: 0.9rem; margin-top: 5px;">肩書き</p>
                </div>
                <button class="modal-close" onclick="closeCharacterModal()" aria-label="閉じる" title="閉じる">✕</button>
            </div>
            <div class="modal-body">
                <div class="character-preview">
                    <img id="modal-char-image" src="" alt="キャラクター">
                </div>
                <div class="character-details">
                    <div class="detail-section">
                        <h4>紹介</h4>
                        <p id="modal-char-desc">キャラクター紹介</p>
                    </div>
                    <div class="detail-section">
                        <h4>表情</h4>
                        <div id="expression-buttons" class="expression-grid">
                            <!-- Expression buttons -->
                        </div>
                    </div>
                    <div class="detail-section">
                        <h4>プロフィール</h4>
                        <div id="char-stats" class="stats-grid">
                            <!-- Stats -->
                        </div>
                    </div>
                    <div class="detail-section" id="freetalk-button-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery Free Talk Overlay -->
    <div id="gallery-freetalk-overlay" class="gallery-freetalk-overlay"></div>

    <!-- Free talk tip popup (modal) -->
    <div id="tip-modal-backdrop" class="tip-modal-backdrop" hidden>
        <div id="tip-modal" class="tip-modal" role="dialog" aria-modal="true" aria-labelledby="tip-modal-title" aria-describedby="tip-modal-body" tabindex="-1">
            <button type="button" id="tip-modal-close" class="tip-modal__close" data-tip-close aria-label="閉じる">✕</button>
            <div class="tip-modal__header">
                <span id="tip-modal-icon" class="tip-modal__icon" aria-hidden="true"></span>
                <div>
                    <p id="tip-modal-eyebrow" class="tip-modal__eyebrow"></p>
                    <h2 id="tip-modal-title" class="tip-modal__title"></h2>
                </div>
            </div>
            <div id="tip-modal-body" class="tip-modal__body"></div>
            <div class="tip-modal__footer">
                <button type="button" id="tip-modal-done" class="tip-modal__done" data-tip-close>閉じる</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="gallery-footer">
        <p>© 2026 ArcherLab. All rights reserved.</p>
    </footer>

    <!-- Gallery Scripts (Dynamic Loader) -->
<script data-cupid-entry-script="true" src="assets/js/loaders/gallery-loader.js?v=2.9.293&history=20260926-gallery-slot"></script>
    <script>
        function toggleLangCombo() {
            document.getElementById('langCombo').classList.toggle('open');
        }
        document.addEventListener('click', function(e) {
            const combo = document.getElementById('langCombo');
            if (combo && !combo.contains(e.target)) {
                combo.classList.remove('open');
            }
        });
    </script>
</body>
