<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Cupid - 미연시 게임</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-05YM7K3VX9"></script>
    <script src="assets/js/ga.js"></script>
    <!-- iOS 전용 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/images/icon.png">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
    <script src="assets/js/browser-check.js" defer></script>
</head>
<body>
    <div id="game-container">
        <!-- 배경 이미지 -->
        <div id="background-layer"></div>
        
        <!-- 캐릭터 레이어 -->
        <div id="character-layer">
            <div id="char-left" class="char-slot"></div>
            <div id="char-center" class="char-slot"></div>
            <div id="char-right" class="char-slot"></div>
        </div>

        <!-- UI 레이어 -->
        <div id="ui-layer">
            <div id="dialogue-box">
                <div id="name-tag"></div>
                <div id="message"></div>
                <div id="next-indicator">▼</div>
            </div>
            
            <div id="choice-container" style="display: none;">
                <!-- 선택지 버튼들이 여기에 생성됨 -->
            </div>

            <!-- 프리토킹 입력창 -->
            <div id="chat-container" style="display: none;">
                <div id="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." maxlength="100">
                    <button id="chat-send" title="전송">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </div>
                <div id="chat-turn-indicator">남은 대화: <span id="turn-count">5</span>회</div>
            </div>

            <!-- 이름 입력창 -->
            <div id="name-input-container" style="display: none;">
                <div id="name-input-wrapper">
                    <input type="text" id="player-name-input" placeholder="이름을 입력하세요 (1~4자)" maxlength="4">
                    <button id="name-confirm-btn">결정</button>
                </div>
                <div id="name-input-guide">한글/영문 1~4자 (숫자, 특수문자 제외)</div>
            </div>
        </div>

        <!-- 페이드 레이어 -->
        <div id="fade-layer">
            <div id="tbc-text">To Be Continued</div>
        </div>
    </div>

    <!-- Day 1 Scenario -->
    <script src="assets/js/scenario/ko_day1_1_morning.js"></script>
    <script src="assets/js/scenario/ko_day1_2_lunch.js"></script>
    <script src="assets/js/scenario/ko_day1_3_afterschool.js"></script>
    <script src="assets/js/scenario/ko_day1_4_night.js"></script>
    
    <!-- Day 2 Scenario -->
    <script src="assets/js/scenario/ko_day2_1_morning.js"></script>
    <script src="assets/js/scenario/ko_day2_2_lunch.js"></script>
    <script src="assets/js/scenario/ko_day2_3_afterschool.js"></script>
    <script src="assets/js/scenario/ko_day2_4_night.js"></script>

    <script src="assets/js/main.js"></script>
    <script>
        window.addEventListener('load', function() {
            var wcs_script = document.createElement('script');
            wcs_script.src = 'https://wcs.pstatic.net/wcslog.js';
            wcs_script.async = true;
            wcs_script.onload = function() {
                if (!window.wcs_add) window.wcs_add = {};
                window.wcs_add["wa"] = "229fd882959ab4";
                if (window.wcs) {
                    wcs_do();
                }
            };
            document.head.appendChild(wcs_script);
        });
    </script>
</body>
</html>
