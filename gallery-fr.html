<!DOCTYPE html>
<html lang="fr">

<head>
    <script src="assets/js/error-reporter.js?v=20260727-offline-analytics-filter"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Galerie - Cupid</title>
    <meta name="description"
        content="Découvrez les profils des personnages de Cupid, les CG d’événements et la salle de musique. Retrouvez les personnages et revivez les moments marquants du jeu.">
    <meta name="robots" content="noindex, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Galerie - Cupid">
    <meta property="og:description" content="Explorez les profils des personnages et les CG d'événements de Cupid.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="stylesheet" as="style" crossorigin
        href="assets/vendor/pretendard/pretendard.css" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css?v=2.9.7">
    <link rel="stylesheet" href="assets/css/gallery.css?v=2.8.12">
    <link rel="stylesheet" href="assets/css/gallery-freetalk.css?v=2.9.8">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-05YM7K3VX9"></script>
    <script src="assets/js/ga.js"></script>
<script src="assets/js/ga-engagement.js?v=20260618-engagement" defer></script>
</head>

<body>
    <!-- Header -->
    <header class="gallery-header">
        <h1>📖 Galerie</h1>
        <div class="header-actions">
            <a href="/index-fr" class="back-btn" onclick="if(window.opener&&!window.opener.closed){window.close();return false;}">← Retour au titre</a>
            <div class="lang-combo" id="langCombo">
                <div class="lang-combo-selected" onclick="toggleLangCombo()">
                    <span class="lang-flag">🇫🇷</span> Français
                </div>
                <div class="lang-combo-dropdown">
                    <a href="gallery.html" class="lang-combo-option" onclick="localStorage.setItem('cupid:language','ko')">
                        <span class="lang-flag">🇰🇷</span> 한국어
                    </a>
                    <a href="gallery-en.html" class="lang-combo-option" onclick="localStorage.setItem('cupid:language','en')">
                        <span class="lang-flag">🇺🇸</span> English
                    </a>
                    <a href="gallery-es.html" class="lang-combo-option" onclick="localStorage.setItem('cupid:language','es')">
                        <span class="lang-flag">🇪🇸</span> Español
                    </a>
                    <a href="gallery-ja.html" class="lang-combo-option" onclick="localStorage.setItem('cupid:language','ja')">
                        <span class="lang-flag">🇯🇵</span> 日本語
                    </a>
                    <div class="lang-combo-option active">
                        <span class="lang-flag">🇫🇷</span> Français
                    </div>
                    <a href="gallery-de.html" class="lang-combo-option" onclick="localStorage.setItem('cupid:language','de')">
                        <span class="lang-flag">🇩🇪</span> Deutsch
                    </a>
                    <a href="gallery-pt.html" class="lang-combo-option" onclick="localStorage.setItem('cupid:language','pt')">
                        <span class="lang-flag">🇧🇷</span> Português
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="gallery-container">
        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="characters">👤 Personnages</button>
            <button class="tab-btn" data-tab="cg">🖼️ CG d'événements</button>
            <button class="tab-btn" data-tab="music">🎵 Salle de musique</button>
        </nav>

        <!-- Tab Contents -->
        <section id="tab-characters" class="tab-content active">
            <div id="character-grid" class="character-grid">
                <!-- Characters will be rendered here -->
            </div>
        </section>

        <section id="tab-cg" class="tab-content">
            <div id="cg-grid" class="cg-grid">
                <!-- CG items will be rendered here -->
            </div>
        </section>

        <section id="tab-music" class="tab-content">
            <div id="music-list" class="music-list">
                <!-- Music items will be rendered here -->
            </div>
        </section>
    </main>

    <!-- Character Detail Modal -->
    <div id="character-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-char-name">Nom du personnage</h2>
                    <p id="modal-char-title" style="color: #aaa; font-size: 0.9rem; margin-top: 5px;">Titre</p>
                </div>
                <button class="modal-close" onclick="closeCharacterModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="character-preview">
                    <img id="modal-char-image" src="" alt="Personnage">
                </div>
                <div class="character-details">
                    <div class="detail-section">
                        <h4>Introduction</h4>
                        <p id="modal-char-desc">Description du personnage</p>
                    </div>
                    <div class="detail-section">
                        <h4>Expressions</h4>
                        <div id="expression-buttons" class="expression-grid">
                            <!-- Expression buttons -->
                        </div>
                    </div>
                    <div class="detail-section">
                        <h4>Profil</h4>
                        <div id="char-stats" class="stats-grid">
                            <!-- Stats -->
                        </div>
                    </div>
                    <div class="detail-section" id="freetalk-button-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery Free Talk Overlay -->
    <div id="gallery-freetalk-overlay" class="gallery-freetalk-overlay"></div>

    <!-- Footer -->
    <footer class="gallery-footer">
        <p>© 2026 ArcherLab. Tous droits réservés.</p>
    </footer>

    <!-- Gallery Scripts (Dynamic Loader) -->
<script data-cupid-entry-script="true" src="assets/js/loaders/gallery-loader.js?v=2.9.109"></script>
    <script>
        function toggleLangCombo() {
            document.getElementById('langCombo').classList.toggle('open');
        }
        document.addEventListener('click', function(e) {
            const combo = document.getElementById('langCombo');
            if (combo && !combo.contains(e.target)) {
                combo.classList.remove('open');
            }
        });
    </script>
</body>

</html>
