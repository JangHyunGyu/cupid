# Cloudflare Pages + D1 + private R2 bindings for Cupid media unlock gating.
# Git-connected Pages: build `npm run build`, publish `dist` from main.
# CUPID_MEDIA_KEY is retained ONLY as the existing session-signing seed in the
# Pages project (Dashboard or `wrangler pages secret put CUPID_MEDIA_KEY`).
#
# Create DB (once):
#   npx wrangler d1 create cupid-gallery-unlocks
# then replace database_id below and run:
#   npx wrangler d1 execute cupid-gallery-unlocks --file=scripts/sql/0001_gallery_unlocks.sql --remote

name = "cupid"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "cupid-media-private"

[[d1_databases]]
binding = "DB"
database_name = "cupid-gallery-unlocks"
database_id = "f4f4fe52-b7f6-4dff-bb12-821e20c1d885"
