<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow">
    <title>Cupid - Visual Novel Game</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-05YM7K3VX9"></script>
    <script src="assets/js/ga.js"></script>
    <!-- iOS Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/images/icon.png">
    
    <link rel="stylesheet" href="assets/css/style.css?v=1.0.10">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
    <script src="assets/js/browser-check.js?v=1.0.10" defer></script>
</head>
<body>
    <div id="game-container">
        <!-- Background Image -->
        <div id="background-layer"></div>
        
        <!-- Character Layer -->
        <div id="character-layer">
            <div id="char-left" class="char-slot"></div>
            <div id="char-center" class="char-slot"></div>
            <div id="char-right" class="char-slot"></div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer">
            <div id="dialogue-box">
                <div id="name-tag"></div>
                <div id="message"></div>
                <div id="next-indicator">▼</div>
            </div>
            
            <div id="choice-container" style="display: none;">
                <!-- Choice buttons will be generated here -->
            </div>

            <!-- Free Talk Input -->
            <div id="chat-container" style="display: none;">
                <div id="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="Type a message..." maxlength="100">
                    <button id="chat-send" title="Send">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                    <button id="chat-skip-btn" title="Stop Conversation">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
                <div id="chat-turn-indicator">Turns left: <span id="turn-count">3</span></div>
            </div>

            <!-- Name Input -->
            <div id="name-input-container" style="display: none;">
                <div id="name-input-wrapper">
                    <input type="text" id="player-name-input" placeholder="Enter your name (1-4 chars)" maxlength="4">
                    <button id="name-confirm-btn">Decide</button>
                </div>
                <div id="name-input-guide">1-4 characters (No numbers or special characters)</div>
            </div>
        </div>

        <!-- Fade Layer -->
        <div id="fade-layer">
            <div id="tbc-text">To Be Continued</div>
        </div>
    </div>

    <!-- Day 1 Scenario -->
    <script src="assets/js/scenario/en_day1_1_morning.js?v=1.0.10"></script>
    <script src="assets/js/scenario/en_day1_2_lunch.js?v=1.0.10"></script>
    <script src="assets/js/scenario/en_day1_3_afterschool.js?v=1.0.10"></script>
    <script src="assets/js/scenario/en_day1_4_night.js?v=1.0.10"></script>

    <!-- Day 2 Scenario -->
    <script src="assets/js/scenario/en_day2_1_morning.js?v=1.0.10"></script>
    <script src="assets/js/scenario/en_day2_2_lunch.js?v=1.0.10"></script>
    <script src="assets/js/scenario/en_day2_3_afterschool.js?v=1.0.10"></script>
    <script src="assets/js/scenario/en_day2_4_night.js?v=1.0.10"></script>

    <script src="assets/js/main.js?v=1.0.10"></script>
    <script>
        window.addEventListener('load', function() {
            var wcs_script = document.createElement('script');
            wcs_script.src = 'https://wcs.pstatic.net/wcslog.js';
            wcs_script.async = true;
            wcs_script.onload = function() {
                if (!window.wcs_add) window.wcs_add = {};
                window.wcs_add["wa"] = "229fd882959ab4";
                if (window.wcs) {
                    wcs_do();
                }
            };
            document.head.appendChild(wcs_script);
        });
    </script>
</body>
</html>
