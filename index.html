<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cupid - 미연시 게임</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;
        }
        #landing-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('assets/images/background/school.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }
        #landing-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            letter-spacing: 5px;
            color: #ff69b4;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 3rem;
        }
        .start-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }
        .start-btn:hover {
            transform: scale(1.1);
            background: #ff1493;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }
        .footer {
            position: absolute;
            bottom: 30px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .contact-links {
            display: flex;
            gap: 20px;
        }
        .contact-link {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            cursor: pointer;
        }
        .contact-link:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* 모바일 가로 모드 최적화 */
        @media (max-height: 500px) and (orientation: landscape) {
            h1 {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
            }
            p {
                font-size: 1.1rem;
                margin-bottom: 1.5rem;
            }
            .start-btn {
                padding: 10px 30px;
                font-size: 1.2rem;
            }
            .footer {
                bottom: 10px;
                gap: 5px;
            }
            .contact-link {
                padding: 5px 15px;
                font-size: 0.8rem;
            }
        }
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.is-open {
            display: flex;
        }
        .modal-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #ff69b4;
        }
        .modal-title {
            margin-top: 0;
            color: #ff69b4;
        }
        .contact-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .contact-option {
            padding: 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .contact-option:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div id="landing-container">
        <div class="content">
            <h1>CUPID</h1>
            <p>당신의 운명을 결정할 전학 첫날의 이야기</p>
            <a href="game.html" class="start-btn">게임 시작</a>
        </div>

        <div class="footer">
            <div class="contact-links">
                <button class="contact-link" onclick="openContactModal()">📞 문의하기</button>
                <button class="contact-link" onclick="installApp()">⬇️ 앱 설치</button>
            </div>
            <p style="font-size: 0.8rem; opacity: 0.7;">© 2025 ArcherLab. All rights reserved.</p>
        </div>
    </div>

    <!-- Contact Modal -->
    <div id="contactModal" class="modal-overlay" onclick="closeContactModal(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <h3 class="modal-title">문의하기</h3>
            <div class="contact-options">
                <a href="https://open.kakao.com/o/pF6xil6h" target="_blank" class="contact-option">💬 카카오톡 오픈채팅</a>
                <a href="mailto:hyungyu@archerlab.dev" class="contact-option">📧 이메일 보내기</a>
            </div>
            <button onclick="closeContactModal()" style="margin-top: 20px; background: none; border: none; color: #aaa; cursor: pointer;">닫기</button>
        </div>
    </div>

    <script>
        function openContactModal() {
            document.getElementById('contactModal').classList.add('is-open');
        }
        function closeContactModal(e) {
            document.getElementById('contactModal').classList.remove('is-open');
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                alert('아이폰/아이패드에서는 [공유] 버튼을 누르고 [홈 화면에 추가]를 선택해주세요.');
            } else {
                alert('이미 설치되어 있거나 지원하지 않는 브라우저입니다.');
            }
        }
    </script>
</body>
</html>
